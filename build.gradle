plugins {
    id "xyz.wagyourtail.unimined" version "1.4.2-SNAPSHOT"
    id 'maven-publish'
    id 'java'
}


version = project.mod_version
group = project.maven_group



repositories {
    mavenLocal()
    maven { url = "https://files.minecraftforge.net/maven/" }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = "https://maven.parchmentmc.net/" }
    mavenCentral()
    maven { url = 'https://babbaj.github.io/maven/' }
}

unimined.minecraft {
    version project.minecraft_version
    mappings {
        mojmap()
        devFallbackNamespace "official"
    }
    defaultRemapJar = true
    
    fabric {
        loader project.loader_version
    }
}

dependencies {
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.withType(Jar).configureEach {
	archiveVersion.set(project.mod_version)
	if (name == 'jar') {
		archiveClassifier.set("fabric-${project.minecraft_version}-dev")
	} else if (name == 'remapJar') {
		archiveClassifier.set("fabric-${project.minecraft_version}")
	} else if (name == 'sourcesJar') {
		archiveClassifier.set("fabric-${project.minecraft_version}-sources")
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

